[package]
description = "Study planner: deadlines, files and notes"
license = "AGPL-3.0-only"
repository = "https://github.com/schrumbo/schrumbi"
name = "schrumbi"
version = "0.2.4"
edition = "2024"
publish = false

[dependencies]
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
anyhow = "1"
async-channel = "2.5.0"
auto-launch = "0.6.0"
base64 = "0.23.1"
calamine = "0.38"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
dirs = "6"
glob = "0.3"
gpui-kit = { version = "0.8.1", features = ["tree-sitter", "tree-sitter-markdown", "tree-sitter-markdown-inline"] }
hayro = "0.8.0"
image = { version = "0.25", default-features = false, features = ["png"] }
lopdf = "0.46.0"
notify = "8.2.1"
notify-rust = "4.18.2"
dunce = "1"
rayon = "1"
semver = "1"
sha2 = "0.10"
similar = "2.7"
ureq = "3"
opener = { version = "0.9.0", features = ["reveal"] }
pulldown-cmark = "0.13.5"
quick-xml = "0.42"
regex = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
rust-embed = "8"
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sys-locale = "0.3.2"
trash = "5.2.9"
typst = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
typst-kit = { version = "0.15.1", default-features = false, features = ["scan-fonts", "embedded-fonts"] }
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-svg = "0.15.1"
mitex = "0.2.4"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
resvg = { version = "0.45.1", default-features = false }
ruzstd = "0.8"
rodio = "0.23"
lsp-types = { version = "0.97", features = ["proposed"] }
ropey = "=2.0.0-beta.1"
unicode-normalization = "0.1.26"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }
walkdir = "2"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }

[profile.dev.package."*"]
opt-level = 2

[package.metadata.deb]
name = "schrumbi"
maintainer = "Schrumbo"
copyright = "Schrumbo"
extended-description = "Deadlines, files and notes for your studies."
section = "education"
assets = [
    ["target/release/schrumbi", "usr/bin/", "755"],
    ["packaging/linux/schrumbi.desktop", "usr/share/applications/", "644"],
    ["packaging/icons/schrumbi.png", "usr/share/icons/hicolor/512x512/apps/schrumbi.png", "644"],
]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.perf]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false

[build-dependencies]
winresource = "0.1.34"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
drag = "2.1.1"
raw-window-handle = "0.6"
tray-icon = "0.26"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
